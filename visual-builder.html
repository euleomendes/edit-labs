<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f4ed;--panel:#fffdf9;--panel2:#fbf8f2;--line:#ece5d9;--line2:#e2d9ca;--ink:#1f1b17;--ink2:#4a443d;--muted:#958c80;
  --red:#d23a2c;--red2:#b82d21;--redsoft:#fbe7e3;--active:#fbf5d8;--mark:#f4e98f;--markInk:#5a4a08;--cutbg:#f3efe7;
  --shadow:0 1px 2px rgba(40,30,20,.06),0 8px 24px rgba(40,30,20,.08);--dock:#fffdf9;--chip:#fff;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--serif:"Instrument Serif",Georgia,serif;
}
:root[data-theme="dark"]{
  --bg:#171513;--panel:#1f1c19;--panel2:#24211d;--line:#302b26;--line2:#3a342d;--ink:#f3eee6;--ink2:#d0c8bc;--muted:#8e857a;
  --redsoft:#3a201c;--active:#2c2818;--mark:#5d5419;--markInk:#f6ea9b;--cutbg:#24211d;--dock:#1c1916;--chip:#25221e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513;--panel:#1f1c19;--panel2:#24211d;--line:#302b26;--line2:#3a342d;--ink:#f3eee6;--ink2:#d0c8bc;--muted:#8e857a;
    --redsoft:#3a201c;--active:#2c2818;--mark:#5d5419;--markInk:#f6ea9b;--cutbg:#24211d;--dock:#1c1916;--chip:#25221e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){color-scheme:dark} }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
/* top bar */
.top{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;min-width:220px}
.logo{width:28px;height:28px;border-radius:7px;background:var(--red);display:grid;place-items:center;color:#fff}
.bname{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.beta{font:500 9px var(--mono);color:var(--red);letter-spacing:.06em}
.bsub{font-size:10.5px;color:var(--muted);margin-top:-1px}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.tab{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:7px;font-weight:500;font-size:12.5px;color:var(--muted)}
.tab svg{width:13px;height:13px}
.tab.on{background:var(--chip);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab.on svg{color:var(--red)}
.tab.done{color:var(--ink2)}
.tright{display:flex;gap:4px;min-width:220px;justify-content:flex-end}
.ib{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink2)}
.ib:hover{background:var(--panel2)}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:16px;height:16px}
/* layout */
.app{position:absolute;top:54px;left:0;right:0;bottom:var(--dockh,178px);display:grid;grid-template-columns:1fr 330px}
.main{overflow:auto;padding:22px 24px 60px 56px}
.inner{max-width:760px}
.side{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 18px;gap:10px;overflow:auto;position:relative}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 6px;font-weight:800}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.hlinks{display:flex;gap:6px;flex-shrink:0;margin-top:6px}
.hlink{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--panel);display:flex;gap:5px;align-items:center}
.hlink:hover{color:var(--ink)}
.lede{color:var(--ink2);font-size:13px;max-width:470px;margin:0 0 10px}
.meta{font-size:11.5px;color:var(--ink2);display:flex;gap:18px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--chip)}
.chip svg{width:13px;height:13px;color:var(--red)}
.chip:hover{border-color:var(--red)}
.chip.on{border-color:var(--red);background:var(--redsoft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
/* transcript rows */
.rows{overflow:visible}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:relative;align-items:start}
.row:last-child{border-bottom:0}
.row.active{background:var(--active)}
.row.vis{min-height:84px}
.num{font:600 12px var(--mono);color:var(--ink2);line-height:1.25}
.num small{display:block;font:400 9.5px var(--mono);color:var(--muted)}
.row.active .num b{color:var(--red)}
.txt{font-size:14.5px;line-height:1.7}
.w{border-radius:3px;padding:1px 0;cursor:pointer}
.w:hover{background:rgba(210,58,44,.12)}
.w.cur{box-shadow:inset 0 -2px 0 var(--red)}
.w.x{text-decoration:line-through;color:var(--muted);text-decoration-color:var(--red)}
.w.hl{font-family:var(--serif);font-style:italic;font-size:17px;background:var(--mark);color:var(--markInk);padding:0 2px}
.w.sel{background:rgba(210,58,44,.2)}
.tag{font:500 9px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.note{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-top:6px}
.cutrow{background:var(--cutbg)}
.cutrow .txt{color:var(--muted)}
.cutrow .txt .w{text-decoration:line-through;text-decoration-color:rgba(210,58,44,.6)}
.egroup{border-bottom:1px solid var(--line)}
.etoggle{width:100%;padding:9px;font:500 10.5px var(--mono);color:var(--ink2);background:var(--panel2);display:flex;justify-content:center;gap:6px;align-items:center}
.etoggle:hover{color:var(--red)}
.etoggle svg{width:12px;height:12px;transition:.2s}
.egroup.open .etoggle svg{transform:rotate(90deg)}
/* look cards */
.lookcol{display:flex;flex-direction:column;gap:8px;min-width:200px}
.lk{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;font-size:11.5px}
.lth{width:30px;height:42px;border-radius:4px;background:#ccc center/cover;position:relative;overflow:hidden;display:grid;place-items:center;font-size:15px}
.lk b{display:block;font-weight:600;font-size:11.5px;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.lk small{color:var(--muted);font-size:10px}
.lk.off{opacity:.5}
.sb{font-size:11px;font-weight:500;display:flex;gap:4px;align-items:center;padding:4px 7px;border-radius:6px;color:var(--ink2)}
.sb:hover{background:var(--panel2);color:var(--ink)}
.sb svg{width:12px;height:12px}
.addlook{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;opacity:0;transition:.15s}
.row:hover .addlook{opacity:1}
/* floating toolbar */
.wtb{position:fixed;z-index:60;background:#1d1a17;color:#fff;border-radius:8px;padding:3px;display:flex;gap:2px;box-shadow:0 8px 20px rgba(0,0,0,.25);font-size:11.5px}
.wtb button{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:6px;white-space:nowrap}
.wtb button:hover{background:rgba(255,255,255,.12)}
.wtb svg{width:12px;height:12px}
/* side preview */
.phone{position:relative;width:230px;aspect-ratio:9/16;border-radius:22px;background:#111;border:5px solid #161412;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;flex-shrink:0}
.phone canvas{width:100%;height:100%;display:block}
.pbadge{position:absolute;top:8px;right:8px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:2px 7px;display:flex;gap:4px;align-items:center;backdrop-filter:blur(4px)}
.plook{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;font-size:9.5px;color:#fff;background:rgba(0,0,0,.5);border-radius:10px;padding:2px 8px;white-space:nowrap}
.pbar{position:absolute;left:6px;right:6px;bottom:6px;display:flex;justify-content:space-around;background:rgba(0,0,0,.45);border-radius:8px;padding:4px;backdrop-filter:blur(4px)}
.pbar button{color:#fff;width:22px;height:20px;display:grid;place-items:center;border-radius:5px}
.pbar button:hover{background:rgba(255,255,255,.15)}
.pbar svg{width:12px;height:12px}
.drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-size:12px;background:rgba(0,0,0,.0);opacity:0;transition:.2s;pointer-events:none}
.drop.drag{opacity:1;background:rgba(0,0,0,.45)}
.pctl{display:flex;align-items:center;gap:10px;font:12px var(--mono);color:var(--ink2)}
.pplay{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.pplay svg{width:14px;height:14px}
.chef{width:100%;background:var(--panel);border:1px solid var(--red);border-radius:10px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);position:relative}
.chef b{display:flex;gap:6px;align-items:center;font-size:12px}
.chef p{margin:3px 0 8px;color:var(--ink2);font-size:11.5px}
.chef .x{position:absolute;top:6px;right:8px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;padding:7px 12px;border-radius:8px;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red2)}
.btn.sm{padding:4px 9px;font-size:11px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:13px;height:13px}
/* dock */
.dock{position:absolute;left:0;right:0;bottom:0;height:var(--dockh,178px);background:var(--dock);border-top:1px solid var(--line);display:flex;flex-direction:column}
.grab{position:absolute;top:-4px;left:50%;width:44px;height:4px;border-radius:2px;background:var(--line2);transform:translateX(-50%)}
.dtools{height:40px;display:flex;align-items:center;justify-content:center;gap:4px;border-bottom:1px solid var(--line);position:relative;padding:0 16px}
.tool{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:5px 9px;border-radius:7px;color:var(--ink2)}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool svg{width:13px;height:13px}
.kbd{font:500 9px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:3px;padding:0 4px}
.zoomer{margin-left:14px;display:flex;align-items:center;gap:6px;color:var(--muted)}
@media (max-width:1250px){ .tool .lbl{display:none} }
.zoomer input{width:110px;accent-color:var(--red)}
.drow{flex:1;display:flex;align-items:center;gap:14px;padding:8px 16px;min-height:0}
.bigplay{width:38px;height:38px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0}
.bigplay svg{width:15px;height:15px}
.bigtime{width:62px;flex-shrink:0}
.bigtime b{font-size:22px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1}
.bigtime small{font:10px var(--mono);color:var(--muted)}
.tlwrap{flex:1;overflow-x:auto;overflow-y:hidden;height:100%;position:relative;scrollbar-width:thin}
.tl{position:relative;height:100%;min-width:100%}
.ruler{position:absolute;left:0;right:0;top:0;height:16px;font:9px var(--mono);color:var(--muted)}
.ruler span{position:absolute;top:2px;transform:translateX(-50%)}
.trk{position:absolute;left:0;right:0}
.trlabel{position:absolute;left:2px;font:500 8px var(--mono);color:var(--muted);top:-11px}
.clip{position:absolute;top:0;height:100%;border-radius:5px;background:#3b342c center/auto 100% repeat-x;border:1.5px solid transparent;overflow:visible}
.clip:hover{border-color:var(--red)}
.clip .hd{position:absolute;top:-1px;bottom:-1px;width:8px;cursor:ew-resize;background:var(--red);opacity:0;border-radius:3px}
.clip:hover .hd{opacity:1}
.clip .hd.l{left:-2px}.clip .hd.r{right:-2px}
.pill{position:absolute;height:7px;border-radius:4px;background:#e98a7e;top:0}
.pill.sel{background:var(--red)}
.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:#c98a3a;top:0;transform:translateX(-50%)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:5;pointer-events:none}
.ph span{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font:600 9px var(--mono);border-radius:4px;padding:1px 4px;white-space:nowrap}
.next{flex-shrink:0;min-width:150px;justify-content:center;padding:10px 14px;font-size:13px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(30,25,20,.38);z-index:80;display:grid;place-items:center;padding:16px;backdrop-filter:blur(2px)}
.mbox{background:var(--panel);border-radius:16px;width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.3);position:relative;display:flex;flex-direction:column}
.mbox.wide{width:min(760px,100%)}
.mhead{padding:20px 22px 6px}
.mbody{padding:6px 22px 16px;flex:1}
.mfoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;bottom:0;background:var(--panel)}
.mx{position:absolute;top:14px;right:14px;color:var(--muted);width:26px;height:26px;border-radius:6px;display:grid;place-items:center}
.mx:hover{background:var(--panel2)}
.kick{display:flex;align-items:center;gap:6px;font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--red);text-transform:uppercase;margin-bottom:4px}
.kick i{width:16px;height:16px;border-radius:50%;background:var(--red);display:inline-block}
.mt{font-size:20px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.msub{font-family:var(--serif);font-style:italic;color:var(--ink2);font-size:15px;margin:0 0 6px}
.mtxt{font-size:12px;color:var(--ink2);margin:4px 0 12px}
.steps{display:flex;gap:4px;margin-bottom:12px}
.steps i{height:3px;flex:1;background:var(--line2);border-radius:2px}
.steps i.on{background:var(--red)}
.sect{font:600 9.5px var(--mono);letter-spacing:.08em;color:var(--muted);margin:14px 0 8px;text-transform:uppercase}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.lb{cursor:pointer}
.lb .th{aspect-ratio:9/14;border-radius:8px;background:#7a6a58 center/cover;position:relative;overflow:hidden;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:8px}
.lb:hover .th,.lb.on .th{border-color:var(--red)}
.lb b{display:block;font-size:12px;margin-top:6px}
.lb small{color:var(--muted);font-size:10.5px;line-height:1.3;display:block}
.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg button{font-size:11.5px;padding:4px 10px;border-radius:14px;border:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.utabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:8px 0 10px}
.utabs button{padding:6px 0;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.utabs button.on{color:var(--ink);border-color:var(--ink)}
.med{cursor:pointer}
.med .th{aspect-ratio:1;border-radius:8px;background:var(--panel2) center/cover;display:grid;place-items:center;font-size:40px;border:2px solid transparent;position:relative;overflow:hidden}
.med .th video{width:100%;height:100%;object-fit:cover}
.med.on .th{border-color:var(--red)}
.med b{font-size:11px;font-weight:500;display:block;text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.med .badge{position:absolute;top:5px;left:5px;font:600 8px var(--mono);background:rgba(0,0,0,.55);color:#fff;border-radius:3px;padding:1px 4px}
.addnew .th{border:1.5px dashed var(--line2);font-size:12px;color:var(--ink2);text-align:center}
textarea.in,input.in{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--panel);resize:vertical;outline:none}
textarea.in:focus,input.in:focus{border-color:var(--red)}
.hint{font-size:11px;color:var(--muted);display:flex;gap:6px;margin-top:6px}
.sk{border:2px solid var(--line);border-radius:10px;padding:6px;cursor:pointer}
.sk.on,.sk:hover{border-color:var(--red)}
.sk .scr{aspect-ratio:9/13;border-radius:6px;background:#7a6a58 center/cover;position:relative;overflow:hidden}
.sk b{display:block;font-size:12px;margin:6px 2px 2px}
.sk small{display:block;font-size:10.5px;color:var(--ink2);line-height:1.35;margin:0 2px}
.cucard{position:absolute;left:12%;right:12%;bottom:18%;border-radius:8px;padding:8px 6px;text-align:center}
.cucard .n{font-size:26px;font-weight:800;line-height:1}
.cucard .l{font-size:7px;margin-top:2px}
.panel{padding:16px 18px;margin-bottom:14px}
.panel h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.panel .sub{font-size:11.5px;color:var(--muted)}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .2s}
.covers{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cov{min-width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:18px;background:var(--panel)}
.cov.txtc{font-size:11px;padding:0 8px;display:flex;gap:5px}
.cov.on{border-color:var(--red);background:var(--redsoft)}
.face{width:74px;text-align:center;font-size:11px;cursor:pointer}
.face .fimg{width:74px;height:74px;border-radius:50%;background:#bbb center/cover;border:3px solid transparent}
.face.on .fimg{border-color:var(--red)}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.dcard{padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);cursor:pointer;position:relative}
.dcard.on{border-color:var(--red)}
.dcard .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);margin-bottom:8px}
.dcard.on .ic{background:var(--red);color:#fff}
.dcard b{font-size:13px}
.dcard p{font-size:11.5px;color:var(--ink2);margin:3px 0 8px}
.dcard .r{position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line2)}
.dcard.on .r{border:4px solid var(--red)}
.dcard .f{font:10px var(--mono);color:var(--red)}
.snaps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.snap{width:56px;aspect-ratio:9/16;border-radius:6px;background:#888 center/cover;position:relative;cursor:pointer;border:2px solid transparent}
.snap.on{border-color:var(--red)}
.snap .st{position:absolute;top:2px;right:3px;font-size:10px}
.snd{display:grid;grid-template-columns:38px 1fr auto auto auto 80px auto;gap:8px;align-items:center;font-size:11.5px;padding:6px 0}
.snd .tg{font:500 9px var(--mono);color:#2f7a4d;background:#e2f3e8;border-radius:4px;padding:1px 5px}
:root[data-theme="dark"] .snd .tg{background:#1d3326;color:#8fd3a8}
.snd input[type=range]{width:80px;accent-color:var(--red)}
.tgl{width:32px;height:18px;border-radius:9px;background:var(--line2);position:relative;transition:.2s;flex-shrink:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on{background:#2f9e5b}.tgl.on::after{left:16px}
.toast{position:fixed;bottom:calc(var(--dockh,178px) + 14px);left:50%;transform:translateX(-50%) translateY(20px);background:#1d1a17;color:#fff;padding:9px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:.25s;z-index:99;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%)}
.pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:190px}
.pop button{display:flex;width:100%;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;font-size:12px;text-align:left}
.pop button:hover{background:var(--panel2)}
.pop button.on{color:var(--red);font-weight:600}
.tour{position:fixed;z-index:95;background:#1d1a17;color:#fff;border-radius:10px;padding:12px 14px;width:260px;font-size:12.5px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.tour b{display:block;margin-bottom:3px}
.tour .tf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:10px var(--mono);color:#aaa}
.ring{position:fixed;z-index:94;border:2px solid var(--red);border-radius:12px;pointer-events:none;box-shadow:0 0 0 9999px rgba(20,15,10,.35);transition:.25s}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block}
.cdot.on{background:#2f9e5b;box-shadow:0 0 0 3px rgba(47,158,91,.18)}
.cdot.busy{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12px;font-weight:600}
.field select{border:1px solid var(--line2);border-radius:10px;padding:9px 10px;background:var(--panel)}
.err{color:var(--red);font-size:12px;margin-top:6px}
.sndmark{color:var(--red);font-size:11px;font-weight:700;margin-right:1px;vertical-align:4px}
.w.sndw{box-shadow:inset 0 -2px 0 rgba(210,58,44,.55)}
.chg{font-size:12px;color:var(--ink2);margin:0;padding-left:18px}
.chg li{margin:3px 0}
.empty-msg{padding:30px;text-align:center;color:var(--muted)}
.slides{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.slides img{height:220px;border-radius:8px;box-shadow:var(--shadow)}
.vers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ver{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
.ver canvas{width:100%;border-radius:6px;aspect-ratio:9/16;background:#000;display:block}
.ver b{font-size:12px;display:block;margin:8px 0 2px}
.ver small{font-size:11px;color:var(--ink2);display:block;margin-bottom:8px}
.sto{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.sto div{font:9px var(--mono);color:var(--muted)}
.sto img{width:100%;border-radius:5px;display:block}
@media (max-width:980px){
  .app{grid-template-columns:1fr 250px}
  .phone{width:190px}
  .main{padding:18px 16px 50px}
  .zoomer{display:none}
  .tool .lbl{display:none}
  .brand .bsub,.brand .bname span:last-child{display:none}
  .brand,.tright{min-width:0}
}
@media (max-width:700px){
  body{overflow:auto}
  .top{padding:0 10px;gap:6px}
  .brand>div:last-child{display:none}
  .tab{padding:5px 7px}.tab span{display:none}
  .app{position:static;display:flex;flex-direction:column-reverse;padding-bottom:var(--dockh,178px)}
  .side{border-left:0;border-bottom:1px solid var(--line)}
  .main{overflow:visible;padding:16px}
  .row{grid-template-columns:36px 1fr;padding:12px}
  .lookcol{grid-column:1/-1;min-width:0}
  .dock{position:fixed}
  .next{min-width:0;padding:9px 10px}
  .bigtime{display:none}
  .grid3,.vers{grid-template-columns:1fr 1fr}
  .grid4{grid-template-columns:repeat(3,1fr)}
  .dest{grid-template-columns:1fr}
  .snd{grid-template-columns:34px 1fr auto auto;}
  .snd .hm{display:none}
}

/* ============================== PERSIST / UNDO ============================== */
const KEYS = ['k','pause','cap','lines','looks','sfx','capStyle','filter','face','music','sfxOn','dest','notes','defaultNotes'];

function restore(js){ const o = JSON.parse(js); KEYS.forEach(k=>{ if(o[k]!==undefined) S[k]=o[k]; }); applyScale(); }
function commit(fn){ undoStack.push(snapshot()); if(undoStack.length>100) undoStack.shift(); redoStack.length=0; fn(); afterChange(); }
function undo(){ if(!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); afterChange(); toast('Undone'); }
function redo(){ if(!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); afterChange(); toast('Redone'); }
let saveT; function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem('vb-state', snapshot()); }catch(e){} },300); }

/* ============================== TIME MAP ============================== */
function buildSegments(){
  segs = []; let cur = null, prevKept = null;
  const lim = S.pause && S.pause.on ? S.pause.max : 0.9*S.k;
  UI.pauses = 0; UI.pauseSaved = 0;
  for (const L of S.lines){
    if (L.cut){ cur=null; prevKept=null; continue; }
    for (const w of L.words){
      if (w.cut){ cur=null; prevKept=null; continue; }
      if (cur && w.s - cur.e < lim){ cur.e = w.e; if(!cur.lines.includes(L.id)) cur.lines.push(L.id); }
      else {
        if (cur && prevKept && w.s - cur.e > 0.15){ UI.pauses++; UI.pauseSaved += (w.s - cur.e) - 0.15; }
        cur = {s:w.s, e:w.e, lines:[L.id]}; segs.push(cur);
      }
      prevKept = w;
    }
  }
  let es = 0; for (const g of segs){ g.s = Math.max(0, g.s-0.05); g.e = g.e+0.1; g.es = es; es += g.e-g.s; }
  for (let i=1;i<segs.length;i++) if (segs[i].s < segs[i-1].e){ segs[i].s = segs[i-1].e; }
  es = 0; for (const g of segs){ g.es = es; es += g.e-g.s; }
  editDur = es;
}

function src2edit(t){ for(const g of segs){ if(t<g.s) return g.es; if(t<g.e) return g.es+(t-g.s); } return editDur; }
function edit2src(et){ for(const g of segs){ if(et < g.es+(g.e-g.s)) return g.s + Math.max(0,et-g.es); } return segs.length? segs[segs.length-1].e-0.01 : 0; }
const fmt = t => { t=Math.max(0,t||0); const m=Math.floor(t/60), s=Math.floor(t%60); return m+':'+String(s).padStart(2,'0'); };
function lineAt(t){ let best=null; for(const L of S.lines){ if(L.cut) continue; if(lineStart(L)-0.15<=t) best=L; else break; } return best; }
function wordAt(L,t){ if(!L) return -1; let k=-1; L.words.forEach((w,i)=>{ if(!w.cut && w.s-0.05<=t) k=i; }); return k; }
const lineById = id => S.lines.find(l=>l.id===id);

const cv = document.getElementById('cv'), cx = cv.getContext('2d');

  ctx.fillStyle='#ecc9ab'; ctx.beginPath(); ctx.ellipse(f.x, f.y+H*0.01, W*0.085, H*0.052, 0, 0, 7); ctx.fill();
  ctx.fillStyle='#d9bd85'; ctx.beginPath(); ctx.ellipse(f.x, f.y-H*0.035, W*0.1, H*0.025, 0, 0, 7); ctx.fill();
  ctx.strokeStyle='#5a4a3a'; ctx.lineWidth=W*0.006; ctx.strokeRect(f.x-W*0.07, f.y-H*0.002, W*0.06, H*0.018); ctx.strokeRect(f.x+W*0.01, f.y-H*0.002, W*0.06, H*0.018);

/* ---------- face detection & tracking (MediaPipe Face Detector, runs in the browser) ---------- */
const MP_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0';
const FACE_MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
let faceDetP = null, fdTs = 0, liveBusy = false, lastLive = 0;
UI.faceTracks = []; UI.liveFaces = null;
function getFaceDetector(){
  if (!faceDetP) faceDetP = (async ()=>{
    const v = await import(MP_URL + '/vision_bundle.mjs');
    const files = await v.FilesetResolver.forVisionTasks(MP_URL + '/wasm');
    const make = delegate => v.FaceDetector.createFromOptions(files, {baseOptions:{modelAssetPath:FACE_MODEL, delegate}, runningMode:'VIDEO', minDetectionConfidence:0.45});
    try { return await make('GPU'); } catch(e){ return await make('CPU'); }
  })();

}
// Faces in a video element, as boxes normalized to the video frame (0..1).
function detectFaces(det, el){
  fdTs = Math.max(fdTs + 1, performance.now());
  const r = det.detectForVideo(el, fdTs); const vw = el.videoWidth, vh = el.videoHeight;
  return (r.detections||[]).map(d=>{ const b = d.boundingBox; return {x:(b.originX+b.width/2)/vw, y:(b.originY+b.height/2)/vh, w:b.width/vw, h:b.height/vh, score:(d.categories&&d.categories[0]&&d.categories[0].score)||0}; });
}
const once = (el, ev) => new Promise(r=>el.addEventListener(ev, r, {once:true}));
// Walk the footage, find every face, and follow each one frame by frame (a track per person).
async function scanFaces(progress){
  const det = await getFaceDetector();
  const v = document.createElement('video'); v.src = vid.src; v.muted = true; v.preload = 'auto'; v.playsInline = true;
  await once(v, 'loadeddata');
  const dur = v.duration, step = Math.max(0.2, dur/450); const tracks = [];
  for (let t = 0.02; t < dur; t += step){
    v.currentTime = t; await once(v, 'seeked');
    for (const f of detectFaces(det, v)){
      let best = null, bd = 1e9;
      for (const tr of tracks){ const last = tr.s[tr.s.length-1]; if (t - last.t > 2.5) continue; const d = Math.hypot(last.x-f.x, last.y-f.y); if (d < bd && d < Math.max(0.1, last.w*1.1)){ bd = d; best = tr; } }

      if (best.s.length && best.s[best.s.length-1].t === t) continue;
      best.s.push({t, ...f});
      if (f.score > best.best){ best.best = f.score; best.thumb = cropFace(v, f); }
    }
    progress(t/dur);
  }
  // join tracks of the same person split by a gap (turned away, out of frame)
  const mean = tr => tr.s.reduce((a,s)=>({x:a.x+s.x/tr.s.length, y:a.y+s.y/tr.s.length}), {x:0,y:0});

    const a = tracks[i], b = tracks[j]; const overlap = b.s[0].t <= a.s[a.s.length-1].t && a.s[0].t <= b.s[b.s.length-1].t;

// Face boxes on the canvas for every face picked to be covered.
function coveredFaces(t, W, H){

    let f = trackAt(tr, t);
    if (UI.liveFaces && Math.abs(UI.liveFaces.t - t) < 0.3){ // snap to a live detection near the predicted spot

function renderFrame(ctx, W, H, t, opts={}){

function splitAt(L, i){
  if (i<=0 || i>=L.words.length){ toast('Pick a word in the middle of the line'); return; }
  commit(()=>{ const idx=S.lines.indexOf(L); const nw = L.words.splice(i); const hl2 = L.hl.filter(h=>h>=i).map(h=>h-i); L.hl = L.hl.filter(h=>h<i); S.lines.splice(idx+1,0,{id:nid('L'),words:nw,cut:false,by:null,hl:hl2,note:'',cap:null}); });
  toast('Split line '+lineNum(L));
}

function applyLook(type, savedIdx, tpl){
  const lineId = UI.lbTarget || currentLineForAdd(); const swap = UI.lbSwap;
  let base = savedIdx!==undefined && UI.saved? JSON.parse(JSON.stringify(UI.saved[+savedIdx])) : {type};
  if (type==='text'){
    const id = swap || nid('k'); const old = swap && S.looks.find(x=>x.id===swap);
    const data = {tpl: tpl||'box', text: (old && old.data && old.data.text) || keptText(lineById(lineId)), sub: tpl==='tag'? 'LISTEN' : tpl==='bubble'? '@you' : ''};
    commit(()=>{ if (old){ old.type='text'; old.data=data; } else S.looks.push({type:'text', data, id, line:lineId}); });
    closeModal(); openTextEditor(id); return;
  }
  if (type==='countup' && !base.data){ const L=lineById(lineId); const m = keptText(L).match(/\$?([\d,]+)/); base.data = {target: m? +m[1].replace(/,/g,''): 100, suffix:'+', label: keptText(L).slice(0,40), style:1, prefix: /\$/.test(keptText(L))?'$':''}; }
  if (type==='eyebrow' && !base.data) base.data = {eyebrow:'LISTEN'};
  if (type==='headline' && !base.data) base.data = {sub:'and that changed everything'};
  commit(()=>{
    if (swap){ const k=S.looks.find(x=>x.id===swap); Object.assign(k, base, {id:k.id, line:k.line}); }
    else S.looks.push({...base, id:nid('k'), line:lineId});
  });
  closeModal(); toast((swap?'Swapped to ':'Added ')+LOOK_TYPES[type].n);
}

async function uploadSource(){

// After the in-browser export: run the 51-effects renderer over the finished reel (times are on the edited timeline).
function vfxPlan(){ return S.looks.filter(k=>k.type==='vfx').map(k=>{ const L=lineById(k.line); const kr=L&&!L.cut&&keptRange(L); if (!kr) return null; const a = src2edit(kr[0]), b = Math.min(editDur, Math.max(src2edit(kr[1]), a + (k.dur ?? 3))); return {fx:k.fx, start:+a.toFixed(2), end:+b.toFixed(2), text:k.text||'', opts:k.opts||{}}; }).filter(Boolean); }
async function applyVfx(blob, ext){
  const plan = vfxPlan(); if (!plan.length) return null;
  const st = await fxStatus(true);
  if (!st.effects){ toast(st.server? 'Video effects renderer isn’t installed — exported without them' : 'Open the editor with “Abrir Editor” to add the video effects — exported without them'); return null; }
  const r = await fetch('/api/upload', {method:'POST', headers:{'X-Ext':ext}, body:blob}); const up = await r.json(); if (!r.ok) throw new Error(up.error||'Upload failed');
  const res = await fetch('/api/fx/render', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id:up.id, effects:plan})});
  const d = await res.json(); if (!res.ok) throw new Error((d.error||'Render failed') + (d.log? ' — '+d.log.join(' ') : ''));
  return d.url;
}

// Apply Claude's operations as one undoable change; returns a readable list of what changed.
function applyOps(ops){
  const log = []; const L = i => S.lines[i];
  commit(()=>{
    for (const c of ops.cut_lines||[]) if (L(c.line) && !L(c.line).cut){ L(c.line).cut=true; L(c.line).by='engine'; log.push(`Cut line ${c.line+1}${c.reason? ' — '+c.reason:''}`); }
    for (const i of ops.restore_lines||[]) if (L(i) && L(i).cut){ L(i).cut=false; L(i).by=null; log.push(`Brought back line ${i+1}`); }
    for (const c of ops.cut_words||[]){ const w = L(c.line)?.words[c.word]; if (w && !w.cut){ w.cut=true; w.by='engine'; log.push(`Cut “${w.w}” (line ${c.line+1})`); } }
    for (const c of ops.restore_words||[]){ const w = L(c.line)?.words[c.word]; if (w && w.cut){ w.cut=false; w.by=null; log.push(`Brought back “${w.w}”`); } }
    for (const h of ops.highlight||[]){ const l=L(h.line); if(!l) continue; const add=h.words.filter(j=>l.words[j] && !l.hl.includes(j)); l.hl.push(...add); if(add.length) log.push(`Highlighted “${add.map(j=>l.words[j].w).join(' ')}”`); }
    for (const h of ops.unhighlight||[]){ const l=L(h.line); if(!l) continue; l.hl = l.hl.filter(j=>!h.words.includes(j)); log.push(`Removed highlight on line ${h.line+1}`); }
    for (const id of ops.remove_looks||[]){ const k=S.looks.find(x=>x.id===id); if(k){ S.looks=S.looks.filter(x=>x!==k); log.push(`Removed ${lookName(k)}`); } }
    for (const o of ops.add_looks||[]){ const l=L(o.line); const k=l&&lookFromClaude(o); if(k){ S.looks.push({...k, id:nid('k'), line:l.id}); log.push(`Added ${lookName(k)} on line ${o.line+1}`); } }
    for (const id of ops.remove_sounds||[]){ if(S.sfx.some(s=>s.id===id)){ S.sfx=S.sfx.filter(s=>s.id!==id); log.push('Removed a sound'); } }
    for (const o of ops.add_sounds||[]){ const l=L(o.line); if(l){ const w = l.words[o.word] ? o.word : 0; S.sfx.push({id:nid('s'), line:l.id, w, off:0, snd:o.sound, vol:.8}); log.push(`Added ${(SFX_LIB.find(s=>s.id===o.sound)||{}).n} on “${l.words[w].w}” (line ${o.line+1})`); } }

    if (ops.filter && ops.filter!=='keep' && ops.filter!==S.filter){ S.filter=ops.filter; log.push('Filter: '+FILTERS[S.filter]); }
    S.lines.forEach(l=>{ if(!l.cut && l.words.length && l.words.every(w=>w.cut)){ l.cut=true; l.by='engine'; } });
  });
  return log;
}

// RMS energy every 20 ms, used to snap word edges to where the voice actually is.
function energyEnvelope(audio, sr=16000){
  const hop = sr*0.02|0, n = Math.floor(audio.length/hop), env = new Float32Array(n);
  for (let i=0;i<n;i++){ let s=0; for (let j=i*hop;j<(i+1)*hop;j++) s+=audio[j]*audio[j]; env[i]=Math.sqrt(s/hop); }
  const sorted = Float32Array.from(env).sort(); const floor = sorted[Math.floor(n*0.1)]||0, speech = sorted[Math.floor(n*0.9)]||0.1;

    let s = w.bs, e = w.be;

const FILLERS = new Set(['umm','uh','uhm','uhh','hmm','hum','hm','ahn','ãh','er','erm','ehh','ahm','éé','éh','mm','mhm']);

  // 1) fillers: "um", "uh", "é," "né," etc. (é/né only when they stand alone between commas)
  for (const L of kept) L.words.forEach((w,i)=>{
    const n = norm(w.w);
    if (FILLERS.has(n) || (/^(um|uh|ah|eh|é|né|tipo|like)(,|…|\.\.\.)+$/i.test(w.w) && L.words.length>2)) cut(w, `Cut filler “${w.w}”`);
  });

  for (const L of kept){ const ws = L.words;
    for (let i=0;i<ws.length;i++){ if (ws[i].cut) continue; const a = norm(ws[i].w); if (!a) continue;
      for (let j=i+1;j<=Math.min(i+2,ws.length-1);j++){
        if (norm(ws[j].w)===a){ const between = ws.slice(i+1,j); if (between.every(b=>b.cut || norm(b.w).length<=3)){ for (let k=i;k<j;k++) cut(ws[k], `Cut restart “${ws[k].w}”`); } break; }
      } } }

  const toks = L => L.words.filter(w=>!w.cut).map(w=>norm(w.w)).filter(Boolean);
  for (let i=0;i<S.lines.length;i++){ const A_ = S.lines[i]; if (A_.cut) continue; const a = toks(A_); if (a.length<2) continue;
    for (let j=i+1;j<=Math.min(i+2,S.lines.length-1);j++){ const B = S.lines[j]; if (B.cut) continue; const b = toks(B); if (!b.length) continue;

    <div class="mbody"><label class="field">Language<select id="tlang"><option value="">Detect automatically</option><option value="portuguese">Português</option><option value="english">English</option><option value="spanish">Español</option><option value="french">Français</option><option value="german">Deutsch</option><option value="italian">Italiano</option></select></label>

    <label style="display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:6px"><input type="checkbox" id="tclean" checked> Cut pauses, filler words, stutters and repeated takes automatically</label>
    <label style="display:flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" id="tedit" ${claudeOn()?'checked':'disabled'}> Then let Claude make the first edit (looks, highlights, sounds, trickier mistakes)${claudeOn()?'':' — connect Claude to turn this on'}</label>
    <div id="tprog" class="hidden" style="margin-top:14px"><div class="prog"><i id="tBar"></i></div><p class="mtxt" id="tTxt">Starting…</p></div><div class="err" id="terr"></div></div>
    <div class="mfoot"><button class="btn ghost" data-act="close">Not now</button><button class="btn" id="tgo">${ICO.mic} Transcribe</button></div>`);
  $('#tgo').onclick = ()=>runTranscribe($('#tlang').value, $('#tmodel').value, $('#tedit').checked, $('#tclean').checked);
}
A.transcribe = openTranscribe;
async function runTranscribe(language, model, thenEdit, clean){
  $('#tgo').disabled = true; $('#tprog').classList.remove('hidden');
  const bar = p=>{ const b=$('#tBar'); if(b) b.style.width=p+'%'; }, txt = t=>{ const e=$('#tTxt'); if(e) e.textContent=t; };
  try{
    txt('Reading the audio…'); const audio = await decode16k(UI.videoFile); const E = energyEnvelope(audio);
    if (!asrWorker) asrWorker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})), {type:'module'});
    const files = {};
    const out = await new Promise((res, rej)=>{
      asrWorker.onmessage = e=>{ const m=e.data;
        if (m.type==='progress' && m.p.status==='progress' && m.p.total){ files[m.p.file]=[m.p.loaded,m.p.total]; const v=Object.values(files); const p = v.reduce((a,x)=>a+x[0],0)/v.reduce((a,x)=>a+x[1],0); bar(p*60); txt(`Downloading the speech model… ${Math.round(p*100)}%`); }
        if (m.type==='status'){ txt(m.text+' (about a third of the video\'s length)'); let q=60; clearInterval(UI.tIv); UI.tIv=setInterval(()=>{ q=Math.min(97,q+0.4); bar(q); },400); }
        if (m.type==='done'){ clearInterval(UI.tIv); res(m.out); }
        if (m.type==='error'){ clearInterval(UI.tIv); rej(new Error(m.message)); } };
      asrWorker.onerror = e=>{ clearInterval(UI.tIv); rej(new Error(e.message||'The speech model failed to load')); };
      asrWorker.postMessage({audio, model, language}, [audio.buffer]);
    });
    const lines = linesFromWords(out.chunks||[]);
    if (!lines.length) throw new Error('No speech found in this video.');
    snapWordsToVoice(lines, E);
    bar(100); let log = [];
    commit(()=>{ S.lines = lines; S.k = 1; rawDur = vid.duration || (lines.at(-1).words.at(-1).be+0.5); applyScale(); S.looks=[]; S.sfx=[]; if (clean){ S.pause.on = true; log = cleanupOps(); } });
    buildStrip(); seekSrc(segs[0]?segs[0].s:0); setTab('cut');
    closeModal();
    toast(`Transcribed ${lines.length} lines` + (clean? ` · ${log.length} mistakes and ${UI.pauses} pauses cut (${UI.pauseSaved.toFixed(1)}s saved)` : ''));
    if (thenEdit) A.claudeedit();
  } catch(err){ $('#terr').textContent = 'Transcription failed: '+err.message; $('#tgo').disabled=false; }
}

/* ---------- Edit script / shortcuts / tour ---------- */
function editScript(){
  openModal(`<div class="mhead"><div class="kick"><i></i> Script</div><h2 class="mt">Paste your own words</h2><p class="mtxt">One line per sentence, in the order you said them. They're timed across your footage (${fmt(rawDur*S.k)}). Looks and sounds reset.</p></div>
    <div class="mbody"><textarea class="in" id="scIn" rows="12">${esc(S.lines.map(l=>l.words.map(w=>w.w).join(' ')).join('\n'))}</textarea></div>
    <div class="mfoot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="scSave">${ICO.check} Use this script</button></div>`, true);
  $('#scSave').onclick=()=>{ const rows=$('#scIn').value.split('\n').map(s=>s.trim()).filter(Boolean); if(!rows.length) return; const total = rawDur*S.k;
    commit(()=>{ S.k=1; S.lines = buildLines(rows.map(t=>({t,h:[]}))); const f = total/rawDur; S.lines.forEach(L=>L.words.forEach(w=>{ w.bs*=f; w.be*=f; })); rawDur = total; applyScale(); S.looks=[]; S.sfx=[]; });
    closeModal(); buildStrip(); render(); toast('Script updated'); };
}
function showShortcuts(){
  const rows=[['Space','Play / pause'],['← →','Back / forward 1s (⇧ for 5s)'],['S','Split at playhead'],['Q','Cut before playhead'],['W','Cut after playhead'],['⌫','Delete the line at the playhead'],['⌘Z / ⇧⌘Z','Undo / redo'],['1–4','Cut · Visuals · Sound · Finish'],['F','Save this frame'],['+ / −','Zoom the timeline']];
  openModal(`<div class="mhead"><div class="kick"><i></i> Shortcuts</div><h2 class="mt">Keyboard shortcuts</h2></div><div class="mbody">${rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px"><span>${r[1]}</span><span class="kbd" style="font-size:11px;padding:1px 6px">${r[0]}</span></div>`).join('')}</div>`);
}
function startTour(){
  const steps = [
    ['#main','Your script','Your words, line by line. Tap a word to jump there, hover to cut, split or leave Claude a note.'],
    ['#phone','The preview','Your rough cut plays here with every look — nothing is rendered until you lock it in. Drop a video on it to use your own footage.'],
    ['#tlwrap','The timeline','Drag a clip edge to trim, like CapCut. Looks and sounds sit on their own rows below.'],
    ['#tabs','Four steps','Cut, then Visuals, then Sound, then Finish. You can jump back to any step.'],
  ];
  let i=0; const ring=document.createElement('div'); ring.className='ring'; const tip=document.createElement('div'); tip.className='tour'; document.body.append(ring,tip);
  const show=()=>{ if(i>=steps.length){ ring.remove(); tip.remove(); return; } const [sel,t,d]=steps[i]; const r=document.querySelector(sel).getBoundingClientRect();
    Object.assign(ring.style,{left:r.left-4+'px',top:r.top-4+'px',width:r.width+8+'px',height:r.height+8+'px'});
    tip.innerHTML=`<b>${t}</b>${d}<div class="tf"><span>${i+1} / ${steps.length}</span><button class="btn sm" id="tourNext">${i<steps.length-1?'Next':'Got it'}</button></div>`;
    const tw=260; let left=r.left+r.width/2-tw/2; let top=r.bottom+12; if(top+150>innerHeight) top=r.top-150; if (sel==='#main'){ left=r.left+r.width-tw-30; top=r.top+80; }
    tip.style.left=Math.max(10,Math.min(innerWidth-tw-10,left))+'px'; tip.style.top=Math.max(10,top)+'px'; $('#tourNext').onclick=()=>{ i++; show(); }; };
  show();
}

/* ---------- timeline interactions ---------- */
(function(){
  const wrapEl = $('#tlwrap'); let mode=null, startX=0, seg=null, side=null;
  wrapEl.addEventListener('pointerdown', e=>{
    const hd = e.target.closest('.hd'); const r = $('#tl').getBoundingClientRect();
    if (hd && S.tab==='cut'){ mode='trim'; side=hd.dataset.h; seg=segs[+hd.parentElement.dataset.seg]; startX=e.clientX; wrapEl.setPointerCapture(e.pointerId); e.stopPropagation(); return; }
    mode='seek'; wrapEl.setPointerCapture(e.pointerId); seekEdit((e.clientX-r.left)/pps());
  });
  wrapEl.addEventListener('pointermove', e=>{
    const r = $('#tl').getBoundingClientRect();
    if (mode==='seek'){ seekEdit((e.clientX-r.left)/pps()); }
    if (mode==='trim'){ const dx=e.clientX-startX; const clip=$(`.clip[data-seg="${segs.indexOf(seg)}"]`); if(!clip) return; const p=pps(); const x0=seg.es*p, w0=(seg.e-seg.s)*p;
      if (side==='l'){ clip.style.left=(x0+dx)+'px'; clip.style.width=Math.max(4,w0-dx)+'px'; } else clip.style.width=Math.max(4,w0+dx)+'px'; }
  });
  wrapEl.addEventListener('pointerup', e=>{
    if (mode==='trim'){ const dt=(e.clientX-startX)/pps(); if (Math.abs(dt)>0.03){
        commit(()=>{ const allW = S.lines.flatMap(L=>L.words.map(w=>({w,L})));
          if (side==='l'){ const nb = seg.s+dt; allW.forEach(({w,L})=>{ if(dt>0 && !w.cut && w.s>=seg.s-0.06 && (w.s+w.e)/2 < nb && w.e<=seg.e+0.01){ w.cut=true; w.by='you'; } if(dt<0 && w.cut && w.s>=nb && w.e<=seg.s+0.06 && !L.cut){ w.cut=false; w.by=null; } }); }
          else { const nb = seg.e+dt; allW.forEach(({w,L})=>{ if(dt<0 && !w.cut && w.s>=seg.s-0.06 && (w.s+w.e)/2 > nb && w.e<=seg.e+0.01){ w.cut=true; w.by='you'; } if(dt>0 && w.cut && w.s>=seg.e-0.12 && w.e<=nb && !L.cut){ w.cut=false; w.by=null; } }); }
          S.lines.forEach(L=>{ if(!L.cut && L.words.every(w=>w.cut)){ L.cut=true; L.by='you'; } }); });
        toast('Trimmed');
      } else renderTimeline(); }
    mode=null;
  });
})();

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e=>{
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  const mod = e.metaKey||e.ctrlKey;
  if (mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey? redo(): undo(); return; }
  if (!$('#modal').classList.contains('hidden')){ if(e.key==='Escape') closeModal(); return; }
  if (e.key===' '){ e.preventDefault(); toggle(); }
  else if (e.key==='ArrowLeft'){ e.preventDefault(); seekEdit(src2edit(srcT)-(e.shiftKey?5:1)); }
  else if (e.key==='ArrowRight'){ e.preventDefault(); seekEdit(src2edit(srcT)+(e.shiftKey?5:1)); }
  else if (e.key==='s'||e.key==='S') A.tsplit(); else if (e.key==='q') A.tbefore(); else if (e.key==='w') A.tafter();
  else if (e.key==='Backspace'||e.key==='Delete') A.tdelete();
  else if (e.key==='f') saveSnap();
  else if (e.key==='+'||e.key==='='){ S.zoom=Math.min(8,S.zoom*1.4); renderDock(); renderTimeline(); }
  else if (e.key==='-'){ S.zoom=Math.max(1,S.zoom/1.4); renderDock(); renderTimeline(); }
  else if ('1234'.includes(e.key)) setTab(['cut','visuals','sound','finish'][+e.key-1]);
  else if (e.key==='Escape'){ hidePop(); wtb.classList.add('hidden'); }
});
addEventListener('resize', ()=>{ renderTimeline(); updateLive(); });

/* ============================== BOOT ============================== */
try{ const th = localStorage.getItem('vb-theme'); if (th) document.documentElement.dataset.theme = th; }catch(e){}
S.lines = buildLines(SCRIPT); applyScale(); seedLooks();
try{ const saved = localStorage.getItem('vb-state'); if (saved){ const o=JSON.parse(saved); if (o.lines && o.lines.length){ restore(saved); const last=o.lines[o.lines.length-1]; rawDur = last.words[last.words.length-1].be+0.5; } } }catch(e){}
buildSegments(); srcT = segs[0]? segs[0].s: 0;
document.fonts.ready.then(()=>{ buildStrip(); render(); });
render(); requestAnimationFrame(loop); setDot();
try { if (localStorage.getItem('vb-state')) videoDB.get('video').then(f=>{ if (f && !hasVideo) loadVideo(f, true); }).catch(()=>{}); } catch(e){}
</script>
